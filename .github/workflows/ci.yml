deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && secrets.EC2_HOST != ''
    steps:
      - name: Check EC2 secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST secret not set - skipping deployment"
            exit 0
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "EC2_SSH_KEY secret not set - skipping deployment"
            exit 0
          fi
          echo "EC2 secrets found - proceeding with deployment"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            cd /home/ubuntu/eventease
            docker-compose pull
            docker-compose up -d --force-recreate --remove-orphans
            docker image prune -f
            docker-compose ps
            echo "Deployment complete!"