name: EventEase CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/eventease-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/eventease-frontend

jobs:

  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: /api

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -e

            echo "Pulling latest Docker images..."

            sudo docker pull aryatambe/eventease-backend:latest
            sudo docker pull aryatambe/eventease-frontend:latest

            echo "Removing old containers..."

            sudo docker rm -f eventease-frontend || true
            sudo docker rm -f backend || true

            echo "Ensuring Docker network exists..."

            sudo docker network inspect eventease-network >/dev/null 2>&1 || \
              sudo docker network create eventease-network

            echo "Starting backend..."

            sudo docker run -d \
              --name backend \
              --network eventease-network \
              --env-file ~/.env \
              -p 5000:5000 \
              aryatambe/eventease-backend:latest

            echo "Starting frontend..."

            sudo docker run -d \
              --name eventease-frontend \
              --network eventease-network \
              -p 80:80 \
              aryatambe/eventease-frontend:latest

            echo "Checking containers..."

            sleep 10

            sudo docker ps

            echo "Checking backend logs..."

            sudo docker logs --tail 20 backend

            echo "Checking frontend logs..."

            sudo docker logs --tail 20 eventease-frontend

            echo "Deployment completed successfully!"