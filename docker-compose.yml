services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventease-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventease-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped